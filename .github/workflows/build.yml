name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le projet Android
        run: |
          mkdir www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.campusnotes.sgne",
            "appName": "Campus Notes",
            "webDir": "www"
          }
          JSON
          npx cap add android

      - name: Mettre l'icône
        run: |
          pip install pillow
          python - <<'PY'
          from PIL import Image
          import pathlib
          src = Image.open(sorted(pathlib.Path(".").glob("*.png"))[0]).convert("RGBA")
          res = pathlib.Path("android/app/src/main/res")
          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          fore = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}
          for d, s in legacy.items():
              for n in ("ic_launcher.png", "ic_launcher_round.png"):
                  src.resize((s, s), Image.LANCZOS).save(res / f"mipmap-{d}" / n)
          for d, s in fore.items():
              src.resize((s, s), Image.LANCZOS).save(res / f"mipmap-{d}" / "ic_launcher_foreground.png")
          (res / "values" / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="ic_launcher_background">#0E3B3A</color>\n</resources>\n')
          PY

      - name: Compiler l'APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: campus-notes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
