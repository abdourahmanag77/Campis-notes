<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e3b3a">
<title>Campus Notes – SGNE</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f3ec;--card:#fff;--tx:#1f2a2a;--mut:#6c7777;--bd:#e3ded2;--side:#0e3b3a;--sidetx:#cfe3df;--ac:#0f766e;--act:#fff;--gold:#e8a33d;--ok:#15803d;--ko:#c2410c;--in:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111817;--card:#1a2322;--tx:#e6efed;--mut:#92a5a2;--bd:#2c3a38;--side:#0a2928;--ac:#2fb5a8;--act:#08201e;--ok:#4ade80;--ko:#fb923c;--in:#223130}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111817;--card:#1a2322;--tx:#e6efed;--mut:#92a5a2;--bd:#2c3a38;--side:#0a2928;--ac:#2fb5a8;--act:#08201e;--ok:#4ade80;--ko:#fb923c;--in:#223130}
*{box-sizing:border-box}
body{margin:0;display:flex;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
aside{width:250px;flex:none;background:var(--side);color:var(--sidetx);padding:18px 12px;position:sticky;top:0;align-self:flex-start;max-height:100dvh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;color:#fff}.brand b{font-size:18px;display:block;line-height:1.1}.brand small{color:var(--sidetx);font-size:11px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--gold);color:#3b2a05;display:grid;place-items:center;font-size:20px}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:16px 10px 6px}
aside button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer}
aside button:hover{background:rgba(255,255,255,.08)}aside button.on{background:var(--gold);color:#2e2204;font-weight:600}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.top h1{margin:0;font-size:20px}.badge{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--mut)}
#view{padding:20px 22px 50px;max-width:1040px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
h2,h3{margin:0 0 10px}h3{font-size:16px}.c{text-align:center}
.hero{background:linear-gradient(120deg,var(--ac),#164e63);color:#fff;border-radius:16px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hero h2{font-size:22px}.hero p{margin:0;opacity:.9;max-width:460px}.hero button{background:var(--gold);color:#2e2204;border:0;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px}
.tile{cursor:pointer}.tile b{font-size:17px;display:block;line-height:1.3;padding:6px 0}.tile span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.donut{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--ok) var(--p),var(--ko) 0);display:grid;place-items:center;margin:6px auto 12px}
.donut b{width:88px;height:88px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;font:inherit;min-width:0;max-width:100%}
input{flex:1 1 130px}select{flex:1 1 180px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--act);padding:9px 15px}
button.s{background:transparent;color:var(--ac)}button.x{background:transparent;color:var(--ko);border-color:var(--bd);padding:3px 9px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{background:var(--card);color:var(--tx);border-color:var(--bd)}.seg button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.seg i{font-style:normal;opacity:.7;margin-left:4px}
ul{list-style:none;margin:0;padding:0}li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
li small,.mut{color:var(--mut)}li small{flex:1;font-size:12px}.ed{min-width:40px;border-bottom:1px dashed var(--bd);outline:none}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-top:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase}td input{width:80px;flex:none}
.ok{color:var(--ok)}.ko{color:var(--ko)}.st{font-size:22px;font-weight:700;margin:6px 0}.tot{font-size:16px;margin:10px 0 0}
.pill{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid currentColor}
#msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;display:none;z-index:9}
@media (max-width:820px){body{display:block}aside{width:auto;position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:10px}
.brand{padding:0 8px 0 0}.brand small,.sec{display:none}aside button{width:auto;white-space:nowrap;padding:8px 12px}#view,.top{padding-left:14px;padding-right:14px}}
@media print{aside,.top,.noprint,#msg{display:none!important}body{background:#fff;color:#000}.card{border:0}:root{--tx:#000;--mut:#444;--bd:#bbb;--ok:#15803d;--ko:#c2410c}}
</style>
</head>
<body>
<aside id="side"></aside>
<div class="main"><div class="top"><h1 id="ttl"></h1><span class="badge">Année universitaire 2026–2027</span></div><div id="view"></div></div>
<div id="msg"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const empty=()=>({fac:[],fil:[],spe:[],cla:[],mat:[],etu:[],not:[],id:1});
function load(){try{const r=JSON.parse(localStorage.getItem('sgne2'));if(r&&r.fac)return r}catch(e){}return empty()}
function save(){try{localStorage.setItem('sgne2',JSON.stringify(db))}catch(e){}}
let db=load(),ui={tab:'home',sub:'fac',cla:0,etu:0,spe:0,edit:0,editM:0};
const nid=()=>db.id++;
const par={fil:['fac','facId'],spe:['fil','filId'],cla:['spe','speId']};
const get=(k,id)=>db[k].find(x=>x.id==id);
function path(k,x){if(!x)return'?';const p=par[k];const s=p?path(p[0],get(p[0],x[p[1]]))+' › '+x.nom:x.nom;return k=='cla'?s+' ('+x.niveau+')':s}
const opts=(l,sel,fn)=>l.map(x=>`<option value="${x.id}"${x.id==sel?' selected':''}>${esc(fn(x))}</option>`).join('');
const pick=(l,id)=>l.some(x=>x.id==id)?id:(l[0]?l[0].id:0);
function msg(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',2600)}
const moy=(d,e)=>Math.round((d*.3+e*.7)*100)/100;
function del(k,id){
  if(k=='etu')db.not=db.not.filter(n=>n.etu!=id);
  else if(k=='mat')db.not=db.not.filter(n=>n.mat!=id);
  else{const kids={fac:['fil'],fil:['spe'],spe:['cla','mat'],cla:['etu']}[k]||[];const fk={fil:'facId',spe:'filId',cla:'speId',mat:'speId',etu:'claId'};
    kids.forEach(c=>db[c].filter(x=>x[fk[c]]==id).forEach(x=>del(c,x.id)))}
  db[k]=db[k].filter(x=>x.id!=id);
}
function calc(eid){
  const e=get('etu',eid),c=get('cla',e.claId),s=get('spe',c.speId),fi=get('fil',s.filId),fa=get('fac',fi.facId);
  let S=0,C=0;const L=db.mat.filter(m=>m.speId==s.id).map(m=>{
    const n=db.not.find(x=>x.etu==eid&&x.mat==m.id)||{d:0,x:0},mo=moy(n.d,n.x);S+=mo*m.coef;C+=m.coef;
    return{m,d:n.d,x:n.x,mo,v:mo>=8}});
  const mg=C?Math.round(S/C*100)/100:0;return{e,c,s,fi,fa,L,mg,ok:L.length>0&&mg>=10};
}

/* ---------- Menu ---------- */
const NAV=[['Pilotage',[['home','🏠','Accueil']]],['Organisation',[['struct','🏛️','Structure académique']]],
 ['Scolarité',[['etu','👥','Étudiants'],['mat','📚','Matières & coefficients']]],
 ['Évaluation',[['notes','✏️','Saisie des notes'],['rank','🏆','Classement'],['rel','🧾','Bulletins']]]];
const TITLE={};NAV.forEach(([,l])=>l.forEach(([k,,t])=>TITLE[k]=t));

/* ---------- Vues ---------- */
function vHome(){
  const T=[['Classes','struct','#e8a33d','cla'],['Étudiants','etu','#db2777',''],['Résultats','rank','#0f766e',''],['Bulletins','rel','#7c3aed','']];
  const rs=db.etu.map(e=>calc(e.id)),adm=rs.filter(r=>r.ok).length,tot=rs.length,pct=tot?Math.round(adm/tot*100):0;
  const top=[...rs].sort((a,b)=>b.mg-a.mg).slice(0,3);
  return `<section class="hero"><div><h2>Bienvenue sur Campus Notes</h2><p>Organisez vos facultés, saisissez les notes et éditez les bulletins en quelques clics.</p></div>
  <button data-a="tab" data-k="${db.fac.length?'notes':'struct'}">${db.fac.length?'Saisir des notes →':'Commencer →'}</button></section>
  <div class="tiles">${T.map(([t,k,c,s])=>`<div class="tile" style="--c:${c}" data-a="go" data-k="${k}" data-s="${s}"><b>${t}</b></div>`).join('')}</div>
  <div class="two"><section class="card c"><h3>Taux de réussite</h3><div class="donut" style="--p:${pct*3.6}deg"><b>${pct} %</b></div>
  <span class="ok">${adm} admis</span> · <span class="ko">${tot-adm} ajournés</span></section>
  <section class="card"><h3>Meilleures moyennes</h3>${top.map((r,i)=>`<li><b>${i+1}</b><span>${esc(r.e.nom+' '+r.e.prenom)}</span><small>${esc(r.c.nom)}</small><b>${f2(r.mg)}</b></li>`).join('')||'<p class="mut">Aucune donnée pour le moment.</p>'}</section></div>`;
}
const LV={fac:'Facultés',fil:'Filières',spe:'Spécialités',cla:'Classes'};
function vStruct(){
  const k=ui.sub,p=par[k];
  return `<div class="seg">${Object.entries(LV).map(([x,t])=>`<button data-a="sub" data-k="${x}" class="${x==k?'on':''}">${t}</button>`).join('')}</div>
  <section class="card"><h3>${LV[k]}</h3><div class="row">${p?`<select id="p_${k}">${opts(db[p[0]],0,x=>path(p[0],x))}</select>`:''}
  <input id="n_${k}" placeholder="Nom">${k=='cla'?'<select id="lv"><option>L1<option>L2<option>L3</select>':''}<button data-a="add" data-k="${k}">Ajouter</button></div>
  <ul>${db[k].map(x=>`<li><span class="ed" contenteditable data-k="${k}" data-id="${x.id}">${esc(x.nom)}</span><small>${p?esc(path(p[0],get(p[0],x[p[1]]))):''}${k=='cla'?' · '+x.niveau:''}</small><button class="x" data-a="del" data-k="${k}" data-id="${x.id}">✕</button></li>`).join('')||'<li class="mut">Aucun élément</li>'}</ul>
  <p class="mut" style="font-size:12px">Cliquez sur un nom pour le modifier. Supprimer supprime aussi tout ce qui en dépend.</p></section>`;
}
function vEtu(){
  const e=get('etu',ui.edit)||{matricule:'',nom:'',prenom:'',claId:0};
  return `<section class="card"><h3>${ui.edit?'Modifier':'Nouvel'} étudiant</h3><div class="row">
  <input id="e_mat" placeholder="Matricule" value="${esc(e.matricule)}"><input id="e_nom" placeholder="Nom" value="${esc(e.nom)}"><input id="e_pre" placeholder="Prénom" value="${esc(e.prenom)}">
  <select id="e_cla">${opts(db.cla,e.claId,x=>path('cla',x))}</select>
  <button data-a="saveEtu">${ui.edit?'Enregistrer':'Ajouter'}</button>${ui.edit?'<button class="s" data-a="cancel">Annuler</button>':''}</div></section>
  <section class="card"><h3>Liste des étudiants</h3><div class="tw"><table><tr><th>Matricule<th>Nom<th>Prénom<th>Classe<th></tr>
  ${db.etu.map(x=>`<tr><td>${esc(x.matricule)}<td>${esc(x.nom)}<td>${esc(x.prenom)}<td>${esc(path('cla',get('cla',x.claId)))}<td><button class="s" data-a="editEtu" data-id="${x.id}">✎</button> <button class="x" data-a="del" data-k="etu" data-id="${x.id}">✕</button></tr>`).join('')||'<tr><td class="mut">Aucun étudiant</tr>'}</table></div></section>`;
}
function vMat(){
  ui.spe=pick(db.spe,ui.spe);const m=get('mat',ui.editM)||{nom:'',coef:1};
  return `<section class="card"><h3>Matières par spécialité</h3><div class="row"><select data-c="spe">${opts(db.spe,ui.spe,x=>path('spe',x))}</select></div>
  <div class="row"><input id="m_nom" placeholder="Nom de la matière" value="${esc(m.nom)}"><input id="m_coef" type="number" min="0.5" step="0.5" value="${m.coef}" style="max-width:90px">
  <button data-a="saveMat">${ui.editM?'Enregistrer':'Ajouter'}</button>${ui.editM?'<button class="s" data-a="cancelM">Annuler</button>':''}</div>
  <div class="tw"><table><tr><th>Matière<th>Coefficient<th></tr>${db.mat.filter(x=>x.speId==ui.spe).map(x=>`<tr><td>${esc(x.nom)}<td>${x.coef}<td><button class="s" data-a="editMat" data-id="${x.id}">✎</button> <button class="x" data-a="del" data-k="mat" data-id="${x.id}">✕</button></tr>`).join('')||'<tr><td class="mut">Aucune matière</tr>'}</table></div></section>`;
}
function selEtu(){
  ui.cla=pick(db.cla,ui.cla);const es=db.etu.filter(x=>x.claId==ui.cla);ui.etu=pick(es,ui.etu);
  return `<div class="row"><select data-c="cla">${opts(db.cla,ui.cla,x=>path('cla',x))}</select><select data-c="etu">${opts(es,ui.etu,x=>x.matricule+' – '+x.nom+' '+x.prenom)}</select></div>`;
}
function vNotes(){
  let h=`<section class="card"><h3>Saisie des notes</h3>${selEtu()}`;
  if(ui.etu){const R=calc(ui.etu);
    h+=`<div class="tw"><table><tr><th>Matière<th>Coef.<th>Devoir /20<th>Examen /20</tr>${R.L.map(l=>`<tr><td>${esc(l.m.nom)}<td>${l.m.coef}<td><input class="nd" data-m="${l.m.id}" value="${l.d}" inputmode="decimal"><td><input class="nx" data-m="${l.m.id}" value="${l.x}" inputmode="decimal"></tr>`).join('')||'<tr><td class="mut">Aucune matière pour cette spécialité</tr>'}</table></div>
    <div class="row" style="margin-top:10px"><button data-a="saveNotes">Enregistrer les notes</button></div>`}
  else h+='<p class="mut">Aucun étudiant dans cette classe.</p>';
  return h+'</section>';
}
function vRank(){
  ui.cla=pick(db.cla,ui.cla);
  const rs=db.etu.filter(x=>x.claId==ui.cla).map(e=>calc(e.id)).sort((a,b)=>b.mg-a.mg);
  return `<section class="card"><h3>Classement et résultats</h3><div class="row"><select data-c="cla">${opts(db.cla,ui.cla,x=>path('cla',x))}</select></div>
  <div class="tw"><table><tr><th>Rang<th>Matricule<th>Étudiant<th>Moyenne<th>Matières validées<th>Résultat</tr>
  ${rs.map((r,i)=>`<tr><td><b>${i+1}</b><td>${esc(r.e.matricule)}<td>${esc(r.e.nom+' '+r.e.prenom)}<td><b>${f2(r.mg)}</b><td>${r.L.filter(l=>l.v).length} / ${r.L.length}<td><span class="pill ${r.ok?'ok':'ko'}">${r.ok?'ADMIS':'AJOURNÉ'}</span></tr>`).join('')||'<tr><td class="mut">Aucun étudiant dans cette classe</tr>'}</table></div></section>`;
}
function vRel(){
  let h=`<section class="card noprint"><h3>Bulletin de notes</h3>${selEtu()}${ui.etu?'<button data-a="print">Imprimer / PDF</button>':''}</section>`;
  if(!ui.etu)return h;const R=calc(ui.etu);
  return h+`<section class="card"><h2 class="c" style="font-size:20px">RELEVÉ DE NOTES</h2>
  <p>Faculté : <b>${esc(R.fa.nom)}</b> · Filière : <b>${esc(R.fi.nom)}</b><br>Spécialité : <b>${esc(R.s.nom)}</b> · Classe : <b>${esc(R.c.nom)} (${R.c.niveau})</b><br>
  Étudiant : <b>${esc(R.e.nom+' '+R.e.prenom)}</b> · Matricule : <b>${esc(R.e.matricule)}</b></p>
  <div class="tw"><table><tr><th>Matière<th>Coef.<th>Devoir<th>Examen<th>Moyenne<th>Mention</tr>
  ${R.L.map(l=>`<tr><td>${esc(l.m.nom)}<td>${l.m.coef}<td>${f2(l.d)}<td>${f2(l.x)}<td>${f2(l.mo)}<td class="${l.v?'ok':'ko'}">${l.v?'Validée':'Non validée'}</tr>`).join('')}</table></div>
  <p class="tot">Moyenne générale pondérée : <b>${f2(R.mg)} / 20</b></p><p class="st ${R.ok?'ok':'ko'}">${R.ok?'ADMIS':'AJOURNÉ'}</p></section>`;
}
const V={home:vHome,struct:vStruct,etu:vEtu,mat:vMat,notes:vNotes,rank:vRank,rel:vRel};
function render(){
  $('#side').innerHTML=`<div class="brand"><div class="logo">🎓</div><div><b>Campus Notes</b><small>SGNE · gestion des notes</small></div></div>`+
    NAV.map(([s,l])=>`<div class="sec">${s}</div>`+l.map(([k,i,t])=>`<button data-a="tab" data-k="${k}"${k==ui.tab?' class="on"':''}>${i} ${t}</button>`).join('')).join('');
  $('#ttl').textContent=TITLE[ui.tab];
  $('#view').innerHTML=V[ui.tab]();
}

/* ---------- Actions ---------- */
const A={
  tab(b,k){ui.tab=k;render();scrollTo(0,0)},sub(b,k){ui.sub=k;render()},go(b,k){ui.tab=k;if(b.dataset.s)ui.sub=b.dataset.s;render();scrollTo(0,0)},
  add(b,k){const n=$('#n_'+k).value.trim();if(!n)return msg('Saisissez un nom.');const o={id:nid(),nom:n},p=par[k];
    if(p){const v=+$('#p_'+k).value;if(!v)return msg('Créez d’abord l’élément parent.');o[p[1]]=v}
    if(k=='cla')o.niveau=$('#lv').value;db[k].push(o);save();render()},
  del(b,k,id){if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Sûr ?';setTimeout(()=>{b.dataset.arm='';b.textContent='✕'},2500);return}
    del(k,id);if(k=='etu'&&ui.edit==id)ui.edit=0;save();render()},
  seed(){const g=nid(),i=nid(),s=nid(),c=nid();db.fac.push({id:g,nom:'Faculté des Sciences'});db.fil.push({id:i,nom:'Informatique',facId:g});
    db.spe.push({id:s,nom:'Génie logiciel',filId:i});db.cla.push({id:c,nom:'GL-A',niveau:'L2',speId:s});
    const ms=[['Algorithmique',3],['Bases de données',3],['Anglais',1]].map(([nom,coef])=>{const m={id:nid(),nom,coef,speId:s};db.mat.push(m);return m});
    [['E001','Diallo','Awa',[[12,14],[9,7],[15,16]]],['E002','Martin','Paul',[[6,8],[7,5],[10,9]]],['E003','Sow','Ibrahima',[[14,13],[12,15],[11,12]]]].forEach(([mat,nom,prenom,ns])=>{
      const e={id:nid(),matricule:mat,nom,prenom,claId:c};db.etu.push(e);ns.forEach((n,j)=>db.not.push({etu:e.id,mat:ms[j].id,d:n[0],x:n[1]}))});
    save();render()},
  saveEtu(){const mat=$('#e_mat').value.trim(),nom=$('#e_nom').value.trim(),pre=$('#e_pre').value.trim(),cla=+$('#e_cla').value;
    if(!mat||!nom||!pre||!cla)return msg('Matricule, nom, prénom et classe sont obligatoires.');
    if(db.etu.some(x=>x.matricule==mat&&x.id!=ui.edit))return msg('Ce matricule existe déjà.');
    if(ui.edit){const e=get('etu',ui.edit);if(get('cla',e.claId).speId!=get('cla',cla).speId)db.not=db.not.filter(n=>n.etu!=e.id);Object.assign(e,{matricule:mat,nom,prenom:pre,claId:cla})}
    else db.etu.push({id:nid(),matricule:mat,nom,prenom:pre,claId:cla});
    ui.edit=0;save();render()},
  editEtu(b,k,id){ui.edit=id;render();scrollTo(0,0)},cancel(){ui.edit=0;render()},
  saveMat(){const nom=$('#m_nom').value.trim(),coef=parseFloat($('#m_coef').value.replace(',','.'));
    if(!ui.spe)return msg('Créez d’abord une spécialité.');if(!nom||!(coef>0))return msg('Nom et coefficient (> 0) requis.');
    if(ui.editM)Object.assign(get('mat',ui.editM),{nom,coef});else db.mat.push({id:nid(),nom,coef,speId:ui.spe});
    ui.editM=0;save();render()},
  editMat(b,k,id){ui.editM=id;render()},cancelM(){ui.editM=0;render()},
  saveNotes(){const out=[];
    for(const d of document.querySelectorAll('.nd')){const m=+d.dataset.m,x=document.querySelector('.nx[data-m="'+m+'"]');
      const a=parseFloat(String(d.value).replace(',','.')),b=parseFloat(String(x.value).replace(',','.'));
      if(!(a>=0&&a<=20&&b>=0&&b<=20))return msg('Les notes doivent être comprises entre 0 et 20.');out.push({etu:ui.etu,mat:m,d:a,x:b})}
    db.not=db.not.filter(n=>!(n.etu==ui.etu&&out.some(o=>o.mat==n.mat))).concat(out);save();msg('Notes enregistrées.')},
  print(){try{window.print()}catch(e){msg('Impression indisponible ici : utilisez le menu du navigateur.')}}
};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b,b.dataset.k,+b.dataset.id)});
document.addEventListener('change',ev=>{const t=ev.target.dataset.c;if(t){ui[t]=+ev.target.value;if(t=='cla')ui.etu=0;render()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.classList.contains('ed')){ev.preventDefault();ev.target.blur()}});
document.addEventListener('focusout',ev=>{const t=ev.target;if(!t.classList||!t.classList.contains('ed'))return;
  const n=t.textContent.trim(),o=get(t.dataset.k,t.dataset.id);if(n&&o)o.nom=n;save();render()});
render();
</script>
